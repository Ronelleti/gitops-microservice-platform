# Prod: no `syncPolicy.automated` block on purpose. ArgoCD will show prod as
# "OutOfSync" when main changes, but will not touch the cluster until
# someone runs `argocd app sync webapp-prod` (or clicks Sync in the UI).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/gitops-microservice-platform.git
    targetRevision: main
    path: webapp-k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: webapp-prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

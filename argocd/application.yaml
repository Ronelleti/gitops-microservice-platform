apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-microservice-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/gitops-microservice-platform.git
    targetRevision: main
    path: k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: microservice-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

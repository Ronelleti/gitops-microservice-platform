apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-beta

resources:
  - ../../base

patches:
  - path: ingress-patch.yaml
  - path: ui-config-patch.yaml

images:
  - name: ghcr.io/your-org/webapp-api
    newTag: beta
  - name: ghcr.io/your-org/webapp-ui
    newTag: beta
  - name: ghcr.io/your-org/webapp-db
    newTag: beta

replicas:
  - name: api
    count: 1
  - name: ui
    count: 1

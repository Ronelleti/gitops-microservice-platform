---
- name: Create app directory
  ansible.builtin.file:
    path: /opt/gitops-microservice-platform
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Copy docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: /opt/gitops-microservice-platform/docker-compose.yml
    mode: "0644"

- name: Render .env with current image tags
  ansible.builtin.template:
    src: env.j2
    dest: /opt/gitops-microservice-platform/.env
    mode: "0644"

- name: Pull latest images
  community.docker.docker_compose_v2:
    project_src: /opt/gitops-microservice-platform
    pull: always
  register: pull_result
  ignore_errors: true

- name: Bring the stack up (build locally if images aren't pre-built/pushed yet)
  community.docker.docker_compose_v2:
    project_src: /opt/gitops-microservice-platform
    build: always
    state: present
---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisite packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Install Docker Engine and Compose plugin
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present

- name: Ensure Docker is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to the docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

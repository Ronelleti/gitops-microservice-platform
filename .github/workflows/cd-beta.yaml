name: CD - promote to beta

# Manual: pick a git sha that CI already built (from a previous CI/CD run
# on main) and promote it to beta. No rebuild - beta runs the exact
# artifact that was already tested and is running in dev.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Git sha to promote (must already have images tagged with this sha in GHCR)"
        required: true

jobs:
  promote:
    name: Promote sha image to beta
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      packages: write
    steps:
      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag webapp images as beta
        run: |
          for svc in ui api db; do
            docker buildx imagetools create \
              --tag "${{ env.IMAGE_NAME }}-webapp-${svc}:beta" \
              "${{ env.IMAGE_NAME }}-webapp-${svc}:${{ inputs.sha }}"
          done

name: CD - swap dev <-> beta

# Manual, true two-way exchange: whatever webapp-dev is currently running
# becomes beta's new image, and whatever webapp-beta is currently running
# becomes dev's new image. No rebuild - both `dev` and `beta` tags just
# point at each other's previous digest. Useful to pull a beta build back
# into dev for further testing, or to hand dev's latest straight to beta
# without knowing its git sha.
on:
  workflow_dispatch:

jobs:
  swap:
    name: Swap dev and beta image tags
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      packages: write
    steps:
      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Swap dev and beta tags
        run: |
          set -euo pipefail
          for svc in ui api db; do
            IMG="${{ env.IMAGE_NAME }}-webapp-${svc}"

            dev_digest=$(docker buildx imagetools inspect "$IMG:dev" | awk '/^Digest:/ {print $2; exit}')
            beta_digest=$(docker buildx imagetools inspect "$IMG:beta" | awk '/^Digest:/ {print $2; exit}')

            echo "$svc: dev was $dev_digest, beta was $beta_digest"

            docker buildx imagetools create --tag "$IMG:dev" "$IMG@$beta_digest"
            docker buildx imagetools create --tag "$IMG:beta" "$IMG@$dev_digest"
          done

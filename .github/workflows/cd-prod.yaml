name: CD - promote to prod

# Manual, and meant to be gated: set up a "production" Environment in repo
# Settings > Environments with required reviewers, and this job will pause
# for approval before it runs. Promotes a sha already proven in dev (and
# ideally beta) to `stable` - the tag webapp-k8s/overlays/prod expects.
# Even after this runs, ArgoCD's prod Application still has no automated
# syncPolicy, so someone still has to `argocd app sync webapp-prod` -
# two independent gates for production on purpose.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Git sha to promote (must already have images tagged with this sha in GHCR)"
        required: true

jobs:
  promote:
    name: Promote sha image to prod
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: write
    steps:
      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag webapp images as stable
        run: |
          for svc in ui api db; do
            docker buildx imagetools create \
              --tag "${{ env.IMAGE_NAME }}-webapp-${svc}:stable" \
              "${{ env.IMAGE_NAME }}-webapp-${svc}:${{ inputs.sha }}"
          done

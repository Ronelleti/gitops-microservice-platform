name: CD - promote to dev

# Runs automatically right after CI/CD finishes building images on main.
# Retags the exact images CI just built (by git sha) as `dev` - no rebuild,
# so dev always runs the identical artifact that was tested.
on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]

jobs:
  promote:
    name: Promote sha image to dev
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Compute lowercase image name and sha
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag webapp images as dev
        run: |
          for svc in ui api db; do
            docker buildx imagetools create \
              --tag "${{ env.IMAGE_NAME }}-webapp-${svc}:dev" \
              "${{ env.IMAGE_NAME }}-webapp-${svc}:${{ env.SHA }}"
          done

name: CD - swap dev <-> prod

# Manual, true two-way exchange: whatever webapp-dev is currently running
# becomes prod's new image (`stable`), and whatever webapp-prod is
# currently running becomes dev's new image. No rebuild - both `dev` and
# `stable` tags just point at each other's previous digest.
#
# Gated by the `production` GitHub Environment, same as cd-prod.yaml - add
# required reviewers to that Environment in repo Settings so this can't run
# without approval. Even after this job completes, ArgoCD's prod
# Application still has no automated syncPolicy, so someone still has to
# `argocd app sync webapp-prod` - two independent gates for production, on
# purpose.
on:
  workflow_dispatch:

jobs:
  swap:
    name: Swap dev and prod image tags
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: write
    steps:
      - name: Compute lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Swap dev and prod (stable) tags
        run: |
          set -euo pipefail
          for svc in ui api db; do
            IMG="${{ env.IMAGE_NAME }}-webapp-${svc}"

            dev_digest=$(docker buildx imagetools inspect "$IMG:dev" | awk '/^Digest:/ {print $2; exit}')
            stable_digest=$(docker buildx imagetools inspect "$IMG:stable" | awk '/^Digest:/ {print $2; exit}')

            echo "$svc: dev was $dev_digest, stable was $stable_digest"

            docker buildx imagetools create --tag "$IMG:dev" "$IMG@$stable_digest"
            docker buildx imagetools create --tag "$IMG:stable" "$IMG@$dev_digest"
          done
